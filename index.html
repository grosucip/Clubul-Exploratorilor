<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mica lume a curiozităților</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      color: #24304a;
      background: linear-gradient(135deg, #dff7ff, #fff4d8);
    }

    header {
      padding: 48px 20px 30px;
      text-align: center;
      background: #ffffffa8;
    }

    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.5rem); }
    header p { font-size: 1.15rem; }

    main {
      width: min(950px, 92%);
      margin: 28px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    section {
      padding: 22px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 8px 24px #29436018;
    }

    h2 { margin-top: 0; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      background: #5267e8;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #394fc9; }
    button:focus-visible { outline: 3px solid #ffbd4a; outline-offset: 3px; }
    .answer { margin-top: 14px; font-weight: 700; }
    footer { padding: 20px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>🌟 Mica lume a curiozităților</h1>
    <p>Idei istețe, lucruri uimitoare și provocări distractive!</p>
  </header>

  <main>
    <section>
      <h2>🐙 Știai că…?</h2>
      <p id="fact">Caracatițele au trei inimi!</p>
      <button onclick="newFact()">Altă curiozitate</button>
    </section>

    <section>
      <h2>🧩 Provocarea zilei</h2>
      <p>Ce număr urmează? <strong>2, 4, 8, 16, …</strong></p>
      <button onclick="showChallenge()">Află răspunsul</button>
      <p class="answer" id="challenge" aria-live="polite"></p>
    </section>

    <section>
      <h2>🚀 Mini-quiz</h2>
      <p>Care este cea mai apropiată stea de Pământ?</p>
      <button onclick="checkAnswer('soare')">Soarele</button>
      <button onclick="checkAnswer('sirius')">Sirius</button>
      <p class="answer" id="quiz" aria-live="polite"></p>
    </section>
  </main>

  <footer>
    <p>Explorează, pune întrebări și descoperă ceva nou! ✨</p>
  </footer>

  <script>
    const facts = [
      "Caracatițele au trei inimi!",
      "Un grup de flamingo se numește stol.",
      "Mierea păstrată bine poate rezista foarte mult timp.",
      "Pe Lună au ajuns oameni pentru prima dată în 1969."
    ];

    function newFact() {
      const current = document.getElementById("fact").textContent;
      let next;
      do {
        next = facts[Math.floor(Math.random() * facts.length)];
      } while (next === current && facts.length > 1);
      document.getElementById("fact").textContent = next;
    }

    function showChallenge() {
      document.getElementById("challenge").textContent =
        "Răspuns: 32 — fiecare număr se dublează.";
    }

    function checkAnswer(answer) {
      document.getElementById("quiz").textContent =
        answer === "soare"
          ? "Corect! ☀️ Soarele este steaua noastră."
          : "Nu chiar — încearcă din nou! 🙂";
    }
  </script>
</body>
</html>
